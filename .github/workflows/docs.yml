name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # The CPU wheel is a far smaller download, and nothing in the docs build runs on a GPU.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # mkdocstrings reads the package's own source to build the API reference.
      - run: pip install -e .
      - run: pip install -r docs/requirements.txt
      # --strict turns every broken link and unresolved reference into a build failure.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main publishes; a pull request builds to prove the docs still compile.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

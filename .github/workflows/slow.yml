# The expensive `slow`-marked reference-model comparisons, kept out of the per-push workflow.
# Runs weekly, on demand, and on pull requests labelled `run-slow`. Skips are reported in the
# job summary and in the uploaded artifact so a comparison that stopped running is visible.
name: slow-reference
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  slow:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-slow')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/noodl
          key: noodl-cache-${{ hashFiles('src/noodl/apps/electrical/power/cases.py') }}
      # `-m slow` overrides the default `-m "not slow"`; --no-cov because the coverage
      # threshold applies to the whole default suite only.
      - name: Run slow tests
        shell: bash   # bash -eo pipefail: a pytest failure is not masked by tee
        env:
          NOODL_PARITY_WORKERS: "2"
        run: >
          python -m pytest -m slow -rs --no-cov -n 2 --junitxml=junit-slow.xml
          tests/verification tests/benchmarks
          | tee slow-output.txt
      - name: Summary
        if: always()
        run: |
          python .github/scripts/junit_summary.py junit-slow.xml "slow reference runs" | tee slow-summary.md >> "$GITHUB_STEP_SUMMARY"
          grep -E '^SKIPPED' slow-output.txt > slow-skips.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-reference-report
          path: |
            junit-slow.xml
            slow-summary.md
            slow-skips.txt
            slow-output.txt

name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # The MATPOWER cases the power-flow tests fetch (`matpower_case`); the key changes with the
      # pinned release and digests in cases.py.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/noodl
          key: noodl-cache-${{ hashFiles('src/noodl/apps/electrical/power/cases.py') }}
      - run: ruff check .
      - run: pytest -q

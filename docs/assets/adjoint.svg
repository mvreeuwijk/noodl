  <text x="131" y="147" font-size="10.5" fill="#1E3A52" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Newton iterate 3</text>
  <line x1="226" y1="143" x2="300" y2="143" stroke="#7C8A99" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arm)"/>

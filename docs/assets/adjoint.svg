  <rect x="56" y="198" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#7C8A99" stroke-width="1.3"/>
  <text x="131" y="215" font-size="10.5" fill="#1E3A52" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Newton iterate 5</text>
  <line x1="226" y1="211" x2="300" y2="211" stroke="#7C8A99" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arm)"/>
  <text x="310" y="130" font-size="11" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">every step</text>
  <text x="310" y="148" font-size="11" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">stored and</text>

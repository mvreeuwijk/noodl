  <text x="56" y="246" font-size="11.5" fill="#C2703D" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">memory grows with the iteration count, plus noise from early iterates</text>

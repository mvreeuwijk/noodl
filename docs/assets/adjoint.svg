  <text x="742" y="174" font-size="12" fill="#17A398" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ONE</text>
  <text x="742" y="192" font-size="10.5" fill="#1E3A52" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">linear solve</text>
  <text x="440" y="246" font-size="11.5" fill="#17A398" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">cost independent of the forward iteration count</text>
</svg>

  <text x="528" y="179" font-size="11" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">TransportLayer · K</text>
  <rect x="510" y="202" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#1E3A52" stroke-width="2"/>

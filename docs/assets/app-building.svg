  <path d="M 418 226 L 452 226" fill="none" stroke="#17A398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="40" y="276" font-size="11.5" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">stack + wind drive the flow; heat and species ride on it</text>
  <rect x="510" y="78" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#17A398" stroke-width="2"/>

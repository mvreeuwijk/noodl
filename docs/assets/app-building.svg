  <text x="170" y="170" font-size="11" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">T = 293 K</text>
  <text x="330" y="150" font-size="13" fill="#1E3A52" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">zone B</text>
  <text x="330" y="170" font-size="11" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">T = 288 K</text>
  <line x1="250" y1="196" x2="250" y2="212" stroke="#17A398" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="228" x2="250" y2="244" stroke="#17A398" stroke-width="6" stroke-linecap="round"/>

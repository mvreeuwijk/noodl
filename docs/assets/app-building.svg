  <path d="M 645 188 L 645 202" fill="none" stroke="#7C8A99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arm)"/>
  <text x="510" y="276" font-size="11.5" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">density closure feeds temperature back into the stack effect</text>
  <path d="M 790 102 Q 806 160 790 218" fill="none" stroke="#17A398" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>

  <text x="258" y="240" font-size="9.5" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(two orifices)</text>
  <line x1="90" y1="140" x2="90" y2="152" stroke="#17A398" stroke-width="6" stroke-linecap="round"/>
  <line x1="410" y1="220" x2="410" y2="232" stroke="#17A398" stroke-width="6" stroke-linecap="round"/>

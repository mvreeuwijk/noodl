<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 316" width="820" height="316" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Orchestration-level coupling</title>
  <desc id="d">Two independent models exchanging values through a ValueLink.</desc>
  <rect width="820" height="316" rx="10" fill="#F7F9FA"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17A398"/></marker>
    <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A52"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8A99"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2703D"/></marker>
  </defs>
  <text x="40" y="34" font-size="15" fill="#1E3A52" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">union — two models, one exchange, never merged</text>
  <rect x="60" y="70" width="290" height="170" rx="8" fill="#FFFFFF" stroke="#17A398" stroke-width="2.5"/>
  <text x="82" y="98" font-size="15" fill="#17A398" text-anchor="start" font-weight="600" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">street</text>
  <text x="82" y="120" font-size="11" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">its own Network, layers, closures</text>
  <text x="82" y="150" font-size="11.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">street.x</text>
  <text x="82" y="168" font-size="10.5" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">concentration, kg/m³</text>
  <text x="82" y="200" font-size="11.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">dt = 3600 s</text>
  <rect x="470" y="70" width="290" height="170" rx="8" fill="#FFFFFF" stroke="#1E3A52" stroke-width="2.5"/>
  <text x="492" y="98" font-size="15" fill="#1E3A52" text-anchor="start" font-weight="600" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">building</text>
  <text x="492" y="120" font-size="11" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">its own Network, layers, closures</text>
  <text x="492" y="150" font-size="11.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">species.x_boundary</text>
  <text x="492" y="168" font-size="10.5" fill="#7C8A99" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">mass fraction, kg/kg</text>
  <text x="492" y="200" font-size="11.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">60 substeps of 60 s</text>
  <path d="M 356 116 L 462 116" fill="none" stroke="#17A398" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="409" y="106" font-size="11" fill="#17A398" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ValueLink</text>
  <text x="409" y="138" font-size="10.5" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace">/ rho_amb</text>
  <path d="M 462 196 L 356 196" fill="none" stroke="#C2703D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/>
  <text x="409" y="186" font-size="11" fill="#C2703D" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">two_way</text>
  <text x="409" y="218" font-size="10.5" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">boundary inflow, kg/s</text>
  <rect x="60" y="258" width="700" height="40" rx="8" fill="#D8F0ED" stroke="#17A398" stroke-width="1.5"/>
  <text x="410" y="283" font-size="12" fill="#1E3A52" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">iterated to a fixed point · one .backward() crosses the join</text>
</svg>

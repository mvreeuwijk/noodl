<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 382" width="820" height="382" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The noodl model stack</title>
  <desc id="d">Network, then elements drives and closures, then layers, then Model.</desc>
  <rect width="820" height="382" rx="10" fill="#262A33"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2EC4B6"/></marker>
    <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E3EAF0"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3AFBC"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E68F57"/></marker>
  </defs>
  <rect x="60" y="60" width="700" height="58" rx="8" fill="#2E333D" stroke="#2EC4B6" stroke-width="2"/>
  <text x="88" y="86" font-size="16" fill="#2EC4B6" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Network</text>
  <text x="88" y="105" font-size="12.5" fill="#A3AFBC" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a typed multigraph — nodes store, edges carry</text>
  <rect x="60" y="140" width="700" height="58" rx="8" fill="#2E333D" stroke="#E3EAF0" stroke-width="2"/>
  <text x="88" y="166" font-size="16" fill="#E3EAF0" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Elements · Drives · Closures</text>
  <text x="88" y="185" font-size="12.5" fill="#A3AFBC" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">your physics: branch laws, driving terms, state functions</text>
  <rect x="60" y="220" width="700" height="58" rx="8" fill="#2E333D" stroke="#2EC4B6" stroke-width="2"/>
  <text x="88" y="246" font-size="16" fill="#2EC4B6" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Layers</text>
  <text x="88" y="265" font-size="12.5" fill="#A3AFBC" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">potential flow · transport · reaction · capacitated transfer</text>
  <rect x="60" y="300" width="700" height="58" rx="8" fill="#2E333D" stroke="#E3EAF0" stroke-width="2"/>
  <text x="88" y="326" font-size="16" fill="#E3EAF0" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Model</text>
  <text x="88" y="345" font-size="12.5" fill="#A3AFBC" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">several layers on one network, stepped together</text>

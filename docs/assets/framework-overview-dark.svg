  <text x="742" y="172" font-size="11.5" fill="#2EC4B6" text-anchor="end" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">yours</text>
  <text x="742" y="252" font-size="11.5" fill="#A3AFBC" text-anchor="end" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">framework</text>

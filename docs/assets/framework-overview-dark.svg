  <line x1="410" y1="198" x2="410" y2="220" stroke="#A3AFBC" stroke-width="2" stroke-linecap="round" marker-end="url(#arm)"/>
  <line x1="410" y1="278" x2="410" y2="300" stroke="#A3AFBC" stroke-width="2" stroke-linecap="round" marker-end="url(#arm)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Network anatomy</title>
  <desc id="d">Two rooms and a wall node, with airpath and wall edge kinds.</desc>
  <rect width="820" height="350" rx="10" fill="#F7F9FA"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17A398"/></marker>
    <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A52"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8A99"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2703D"/></marker>
  </defs>
  <text x="40" y="36" font-size="15" fill="#1E3A52" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">One network, two edge kinds</text>
  <rect x="250" y="70" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="94" font-size="12" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">interior — solved</text>
  <line x1="330" y1="160" x2="470" y2="160" stroke="#17A398" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="470" y1="160" x2="640" y2="160" stroke="#17A398" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="330" y1="160" x2="400" y2="250" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <line x1="400" y1="250" x2="640" y2="160" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <circle cx="330" cy="160" r="13" fill="#17A398" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="470" cy="160" r="13" fill="#17A398" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="400" cy="250" r="13" fill="#17A398" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="640" cy="160" r="13" fill="#1E3A52" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="330" y="137" font-size="13" fill="#1E3A52" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A</text>
  <text x="470" y="137" font-size="13" fill="#1E3A52" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">B</text>
  <text x="400" y="277" font-size="12" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">wall mass</text>
  <text x="640" y="137" font-size="13" fill="#1E3A52" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ambient</text>
  <text x="640" y="195" font-size="11.5" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">boundary —</text>
  <text x="640" y="210" font-size="11.5" fill="#7C8A99" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">prescribed</text>
  <line x1="60" y1="320" x2="100" y2="320" stroke="#17A398" stroke-width="3.5" stroke-linecap="round"/>
  <text x="110" y="325" font-size="12.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">kind="airpath"  — air flows, heat advects</text>
  <line x1="430" y1="320" x2="470" y2="320" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="480" y="325" font-size="12.5" fill="#1E3A52" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">kind="wall"  — heat conducts only</text>

site_name: noodl physics
site_description: >-
  noodl physics — an open-source framework for differentiable network modelling of
  physical systems, built on PyTorch.
site_url: https://mvreeuwijk.github.io/noodl/
repo_url: https://github.com/mvreeuwijk/noodl
repo_name: mvreeuwijk/noodl
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Maarten van Reeuwijk, John Craske and Imperial College London. BSD 3-Clause licence.

theme:
  name: material
  logo: assets/noodl-physics-symbol-white.svg
  favicon: assets/noodl-physics-symbol.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

# The nav lives here rather than in a toctree inside the pages, so that every
# .md file under docs/ stays plain Markdown and renders correctly when read
# directly on GitHub.
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Using noodl: usage.md
  - Concepts:
      - concepts/index.md
      - Networks: concepts/networks.md
      - Elements and drives: concepts/elements.md
      - Layers and models: concepts/layers.md
      - Solvers: concepts/solvers.md
      - Differentiability: concepts/differentiability.md
  - Applications:
      - applications/index.md
      - Building physics: applications/building_physics.md
      - Street air quality:
          - applications/street_aq.md
          - Reading and writing cases: applications/street_aq_cases.md
      - Sewers: applications/sewer.md
      - Water distribution: applications/water.md
      - Flow allocation: applications/allocation.md
      - Coupling: applications/coupling.md
  - Catalogue:
      - Core library: catalogue/core.md
      - Building physics: catalogue/building_physics.md
      - Street air quality: catalogue/street_aq.md
      - Sewers: catalogue/sewer.md
      - Water distribution: catalogue/water.md
      - Flow allocation (WSIMOD): catalogue/wsimod.md
  - Verification: verification.md
  - File formats:
      - formats/index.md
      - CONTAM (.prj, .wth): formats/contam.md
      - Modelica Buildings Library: formats/modelica.md
      - SWMM (.inp): formats/swmm.md
      - EPANET (.inp): formats/epanet.md
  - Development:
      - Extending noodl: development/extending.md
  - API reference: api.md
  - Theory: theory.md
  - About: about.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/theme-figures.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvreeuwijk/noodl

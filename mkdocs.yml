site_name: noodl physics
site_description: >-
  noodl physics — an open-source framework for differentiable network modelling of
  physical systems, built on PyTorch.
site_url: https://mvreeuwijk.github.io/noodl/
repo_url: https://github.com/mvreeuwijk/noodl
repo_name: mvreeuwijk/noodl
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Maarten van Reeuwijk, John Craske and Imperial College London. BSD 3-Clause licence.

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  logo: assets/noodl-physics-symbol-white.svg
  favicon: assets/noodl-physics-symbol.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

# The nav lives here rather than in a toctree inside the pages, so that every
# .md file under docs/ stays plain Markdown and renders correctly when read
# directly on GitHub.

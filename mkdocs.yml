site_name: noodl physics
site_description: >-
  noodl physics — an open-source framework for differentiable network modelling of
  physical systems, built on PyTorch.
site_url: https://mvreeuwijk.github.io/noodl/
repo_url: https://github.com/mvreeuwijk/noodl
repo_name: mvreeuwijk/noodl
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Maarten van Reeuwijk, John Craske and Imperial College London. BSD 3-Clause licence.

theme:
  name: material
  logo: assets/noodl-physics-symbol-white.svg
  favicon: assets/noodl-physics-symbol.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

# The nav lives here rather than in a toctree inside the pages, so that every
# .md file under docs/ stays plain Markdown and renders correctly when read
# directly on GitHub.
nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Your first model: get-started/first-model.md
      - Run a model from a file: get-started/run-from-file.md
      - Calibrate against data: get-started/calibrate.md
  - User guide:
      - guide/index.md
      - Workflow: guide/workflow.md
      - Time stepping: guide/time-stepping.md
      - Reading results: guide/results.md
      - Batches: guide/batches.md
      - Gradients: guide/gradients.md
      - Components: guide/components.md
      - Coupling: guide/coupling.md
      - Mutation, devices and serialization: guide/devices.md
      - Choosing a solver: guide/solvers.md
      - Troubleshooting: guide/troubleshooting.md
  - Applications:
      - applications/index.md
      - Building physics:
          - applications/building/index.md
          - Physics: applications/building/physics.md
          - CONTAM files: applications/building/contam.md
          - Modelica files: applications/building/modelica.md
          - Limitations: applications/building/limitations.md
          - Theoretical background: applications/building/background.md
      - Street air quality:
          - applications/street/index.md
          - Physics: applications/street/physics.md
          - Reading and writing cases: applications/street/cases.md
          - Unsteady above-roof puffs: applications/street/puffs.md
          - Limitations: applications/street/limitations.md
          - Theoretical background: applications/street/background.md
      - Sewers:
          - applications/sewer/index.md
          - Physics: applications/sewer/physics.md
          - SWMM files: applications/sewer/swmm.md
          - Limitations: applications/sewer/limitations.md
          - Theoretical background: applications/sewer/background.md
      - Water distribution:
          - applications/water/index.md
          - Physics: applications/water/physics.md
          - EPANET files: applications/water/epanet.md
          - Limitations: applications/water/limitations.md
          - Theoretical background: applications/water/background.md
      - Water resources:
          - applications/water-resources/index.md
          - Flow allocation: applications/water-resources/allocation.md
          - WSIMOD: applications/water-resources/wsimod.md
          - WSIMOD configuration files: applications/water-resources/wsimod-config.md
          - Differences from WSIMOD: applications/water-resources/differences.md
          - Theoretical background: applications/water-resources/background.md
      - Electrical circuits:
          - applications/electrical/index.md
          - Physics: applications/electrical/physics.md
          - MATPOWER files: applications/electrical/matpower.md
          - Limitations: applications/electrical/limitations.md
  - Examples:
      - examples/index.md
  - Concepts:
      - concepts/index.md
      - The four modes: concepts/four-modes.md
      - Networks: concepts/networks.md
      - Constitutive laws and drives: concepts/elements.md
      - Layers and models: concepts/layers.md
      - Solvers: concepts/solvers.md
      - Differentiability: concepts/differentiability.md
      - Theory: concepts/theory.md
  - Reference:
      - reference/index.md
      - API: reference/api/index.md
      - Catalogue:
          - reference/catalogue/index.md
          - Core library: reference/catalogue/core.md
          - Building physics: reference/catalogue/building_physics.md
          - Street air quality: reference/catalogue/street_aq.md
          - Sewers: reference/catalogue/sewer.md
          - Water distribution: reference/catalogue/water.md
          - WSIMOD: reference/catalogue/wsimod.md
          - Electrical circuits: reference/catalogue/electrical.md
      - Keys and options: reference/keys.md
      - Transport options: reference/transport-options.md
      - File formats: reference/formats.md
      - Verification:
          - reference/verification/index.md
          - Building physics: reference/verification/building.md
          - Street air quality: reference/verification/street.md
          - Sewers: reference/verification/sewer.md
          - Water distribution: reference/verification/water.md
          - Water resources: reference/verification/water-resources.md
          - Electrical circuits: reference/verification/electrical.md
  - Project:
      - About: project/about.md
      - Contributing: project/contributing.md
      - Testing: project/testing.md
      - Changelog: project/changelog.md
      - Extending noodl: project/extending/index.md
      - Design notes:
          - project/design/index.md
          - Core orchestration: project/design/orchestration.md
          - Sewers: project/design/sewer.md
          - Solver selection: project/design/solvers.md
          - Water and street air quality: project/design/water_street.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/theme-figures.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvreeuwijk/noodl

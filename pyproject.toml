[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tellegen"
version = "0.0.1"
description = "Network topology and conservative physics on graphs for building simulation (PyTorch)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "John Craske"}, {name = "Maarten van Reeuwijk"}]
dependencies = [
    "torch>=2.2",
    "networkx>=3.2",
    "numpy>=1.26"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6", "pytest-cov", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tellegen --cov-report=term-missing --cov-fail-under=90 -m \"not slow\""
markers = [
    "slow: marks tests as slow (excluded by default; run with -m slow to include them)",
]

[tool.coverage.run]
source = ["tellegen"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noodl"
version = "0.0.1"
description = "Network topology and conservative physics on graphs for building simulation (PyTorch)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "John Craske"}, {name = "Maarten van Reeuwijk"}]
dependencies = [
    "torch>=2.2",
    "networkx>=3.2",
    "numpy>=1.26"
]

[project.urls]
Homepage = "https://github.com/mvreeuwijk/noodl"
Documentation = "https://mvreeuwijk.github.io/noodl/"
Repository = "https://github.com/mvreeuwijk/noodl"
Issues = "https://github.com/mvreeuwijk/noodl/issues"

[project.optional-dependencies]
# `sparse` is a RUNTIME extra, not a developer convenience. `method="auto"` prefers the
# SciPy SuperLU backend for a certified-SPD operator with a sparse form at a flat batch of
# at most 32, so on a plain `pip install noodl` the documented
# default silently never fires and every such solve falls back to PCG -- correct, and 4.6x
# slower at ensemble 1. It stays OPTIONAL rather than becoming a hard dependency because the
# evidence for the default is one platform at one problem size, and PCG remains a complete answer without it.
sparse = ["scipy>=1.11"]
# `dev` restates `sparse`'s requirement rather than referencing the extra recursively: the
# test suite exercises the sparse-direct backend directly, and a plain pin is one fewer
# resolver feature for `pip install -e ".[dev]"` to depend on. Keep the two in step.
# pyswmm parity (rows W1-W4): BSD-2-Clause, wrapping SWMM 5, whose engine is public domain
# (US-government work) / CC0. Test-only (`importorskip`); the sewer application itself needs
# nothing beyond torch and the existing `sparse` extra.
# wntr parity (rows D1-D8, G2): Revised BSD, wrapping EPANET 2.2, whose engine is MIT-licensed
# -- but wntr drags in a MEASURED 351 MB mandatory dependency stack (scipy 114.5 MB, pandas
# 62.9 MB, numpy 53.7 MB, matplotlib + fontTools + Pillow 64.9 MB, networkx 15.5 MB; wntr's
# own code and its four DLLs are 10.8 MB). Test-only (`importorskip`); NOT a runtime extra,
# for the same reason.
# wsimod parity (rows W1-W7): BSD-3-Clause. Pinned exactly (`==0.8.1`), unlike
# the `>=` pins above, because the committed fixtures under tests/data/wsimod/ freeze one
# specific wsimod run -- a newer release could
# silently change quickstart_demo/oxford_demo's forcing or node parameters, which an `>=` pin
# would not catch. Test-only (`importorskip`); never a runtime dependency of noodl itself.
dev = [
    "pytest>=8", "ruff>=0.5", "hypothesis>=6", "pytest-cov", "scipy>=1.11",
    "pyswmm>=2.1", "wntr>=1.5", "wsimod==0.8.1",
]
# ContamX parity: NIST's `contamxpy` ships a Windows x86-64 wheel that
# BUNDLES the ContamX 3.4.1.7 engine, so no CONTAM installation is needed -- but there is
# no wheel for any other platform, hence the marker. Tests that need it carry `external`
# and skip themselves when the import fails, so CI on Linux is unaffected.
contam = ["contamxpy>=0.0.9; sys_platform == 'win32'"]
# `street_aq` is a RUNTIME extra: `apps/street_aq/report.py`'s `write_network_concentration`
# writes its classic-CDF product through `scipy.io.netcdf_file`. Nothing else in the street
# application, and no path the core solves take, needs it.
street_aq = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=noodl --cov-report=term-missing --cov-fail-under=90 -m \"not slow\""
markers = [
    "slow: marks tests as slow (excluded by default; run with -m slow to include them)",
    "external: needs an external engine or package (contamxpy); skipped when unavailable",
]

[tool.coverage.run]
source = ["noodl"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
